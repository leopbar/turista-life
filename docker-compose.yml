# Publicação no VPS: os containers escutam só em 127.0.0.1.
# O nginx do servidor repassa https://lbai.dev/turista-life/ para o site (3010)
# e https://painel-turista-life.lbai.dev/ para o painel (3011).
services:
  turista-life:
    build:
      context: .
      args:
        BASE_PATH: /turista-life/
    image: turista-life
    container_name: turista-life
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    # Conteúdo publicado pelo painel (site.json e fotos), só leitura.
    volumes:
      - painel-public:/usr/share/nginx/html/turista-life/cms:ro
    depends_on:
      - turista-life-painel

  # Turista-Life Administração. Isolado: só fala com os próprios volumes.
  turista-life-painel:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: turista-life-painel
    container_name: turista-life-painel
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:8000"
    # Alertas por Gmail (opcional): PAINEL_GMAIL_USER, PAINEL_GMAIL_APP_PASSWORD, PAINEL_ALERT_TO.
    env_file:
      - path: .env.painel
        required: false
    volumes:
      - painel-data:/data
      - painel-public:/data/public
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  # Banco, chave e backups: só o painel enxerga.
  painel-data:
  # Conteúdo publicado e fotos: o painel escreve, o site lê.
  painel-public:
