[project]
name = "painel"
version = "0.1.0"
description = "Turista-Life Administração: servidor do painel (login, usuários, conteúdo)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
