# nginx de dentro do container: serve o build em /turista-life/ com fallback de SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (JS/CSS do Vite) podem ficar em cache por muito tempo.
    location /turista-life/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /turista-life/images/ {
        expires 30d;
        try_files $uri =404;
    }

    # Rotas do React Router (/turista-life/diario etc.) caem no index.html.
    location /turista-life/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /turista-life/index.html;
    }

    location = /turista-life {
        return 301 /turista-life/;
    }
}
