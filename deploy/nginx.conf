# nginx de dentro do container: serve o build na raiz com fallback de SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (JS/CSS do Vite) podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        try_files $uri =404;
    }

    # Conteúdo publicado pelo painel (volume só leitura). Sem listagem de pastas, só leitura.
    location = /cms/site.json {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Fotos e capas de vídeo: o nome de cada arquivo nunca muda de conteúdo.
    location /cms/ {
        limit_except GET HEAD { deny all; }
        location ~ \.(webp|jpg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri =404;
        }
        return 404;
    }

    # Rotas do React Router (/diario etc.) caem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

}
