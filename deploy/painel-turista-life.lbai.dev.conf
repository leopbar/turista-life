# nginx DO SERVIDOR (host), arquivo NOVO e exclusivo do painel.
# Instalar em /etc/nginx/sites-available/painel-turista-life.lbai.dev e ligar em sites-enabled.
# Não mexe em nenhum outro site: tudo aqui vale só para painel-turista-life.lbai.dev.
#
# Certificado (só deste subdomínio), antes de ligar o bloco 443:
#   certbot certonly --nginx -d painel-turista-life.lbai.dev
# Sempre: nginx -t && systemctl reload nginx

# Limite de pedidos SÓ do painel (nomes de zona próprios, não afetam outros sites).
limit_req_zone $binary_remote_addr zone=painel_tl_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=painel_tl_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name painel-turista-life.lbai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name painel-turista-life.lbai.dev;

    ssl_certificate     /etc/letsencrypt/live/painel-turista-life.lbai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel-turista-life.lbai.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 30m;

    # Excesso de pedidos neste bloco: o nginx responde 429 só para o painel.
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=painel_tl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=painel_tl_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
