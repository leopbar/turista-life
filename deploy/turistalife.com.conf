# nginx DO SERVIDOR (host) da VPS da OVH: site e painel do Turista Life.
# Instalar em /etc/nginx/sites-available/turistalife.com e ligar em sites-enabled.
#
#   turistalife.com, www.turistalife.com  -> site (container turista-life, 127.0.0.1:3010)
#   painel.turistalife.com                -> painel (container turista-life-painel, 127.0.0.1:3012)
#
# Certificado (um só, cobre os três nomes), ANTES de ligar este arquivo:
#   certbot certonly --standalone -d turistalife.com -d www.turistalife.com -d painel.turistalife.com
# Sempre: nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=painel_tl_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=painel_tl_api:10m rate=10r/s;

# ---- Site ----
server {
    listen 80;
    listen [::]:80;
    server_name turistalife.com www.turistalife.com;
    # Renovação do certificado (webroot), sem parar o nginx.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://turistalife.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.turistalife.com;

    ssl_certificate     /etc/letsencrypt/live/turistalife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turistalife.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://turistalife.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turistalife.com;

    ssl_certificate     /etc/letsencrypt/live/turistalife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turistalife.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Painel ----
server {
    listen 80;
    listen [::]:80;
    server_name painel.turistalife.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name painel.turistalife.com;

    ssl_certificate     /etc/letsencrypt/live/turistalife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turistalife.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 30m;

    # Excesso de pedidos neste bloco: o nginx responde 429 só para o painel.
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=painel_tl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=painel_tl_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
